<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Jangmao70 — Offline Word Document Automation</title>
<desc id="desc">โปรแกรมสร้างเอกสาร Word บน Windows รองรับงานจัดซื้อจัดจ้างและเบิกเงินเดือน</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152f"/><stop offset=".55" stop-color="#142953"/><stop offset="1" stop-color="#29113f"/></linearGradient>
<linearGradient id="gold"><stop stop-color="#ae792b"/><stop offset=".45" stop-color="#ffe6a0"/><stop offset="1" stop-color="#c9933d"/></linearGradient>
<linearGradient id="ribbon"><stop stop-color="#25dcf5"/><stop offset=".5" stop-color="#9574ff"/><stop offset="1" stop-color="#fa52b4"/></linearGradient>
<radialGradient id="violet"><stop stop-color="#7532cb" stop-opacity=".6"/><stop offset="1" stop-color="#7532cb" stop-opacity="0"/></radialGradient>
<clipPath id="canvas"><rect width="1440" height="560" rx="20"/></clipPath>
</defs>
<g clip-path="url(#canvas)">
<rect width="1440" height="560" fill="url(#bg)"/>
<ellipse cx="1270" cy="100" rx="480" ry="410" fill="url(#violet)"/>
<circle cx="1380" cy="25" r="225" fill="none" stroke="#a98bff" stroke-opacity=".2" stroke-width="58"/>
<circle cx="1380" cy="25" r="310" fill="none" stroke="#f8d68b" stroke-opacity=".18"/>
