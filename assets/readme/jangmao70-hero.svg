<g font-size="16" font-weight="700" text-anchor="middle">
<rect x="80" y="345" width="145" height="40" rx="20" fill="#41daf1"/><text x="152" y="371" fill="#07152f">WINDOWS</text>
<rect x="238" y="345" width="155" height="40" rx="20" fill="#ed66b6"/><text x="315" y="371" fill="#24102e">LOCAL DATA</text>
<rect x="406" y="345" width="192" height="40" rx="20" fill="#f5ce79"/><text x="502" y="371" fill="#251d0e">WORD OUTPUT</text>
</g>
<g transform="translate(930 120)">
<rect width="408" height="248" rx="16" fill="#09172f" stroke="#9781d0"/>
<path d="M0 46H408" stroke="#443661"/>
<circle cx="24" cy="24" r="5" fill="#fa66b9"/><circle cx="42" cy="24" r="5" fill="#f5ce79"/><circle cx="60" cy="24" r="5" fill="#41daf1"/>
<text x="382" y="29" fill="#c3d2eb" font-size="12" text-anchor="end" letter-spacing="2">TWO WORKFLOWS</text>
<rect x="24" y="70" width="7" height="44" rx="3" fill="#56dec7"/>
<text x="48" y="96" fill="#b5fff1" font-size="23" font-weight="600">จัดซื้อจัดจ้างและสัญญา</text>
<rect x="24" y="131" width="7" height="44" rx="3" fill="#7cb8ff"/>
