<path d="M0 462 C240 346 360 582 666 447 S1110 348 1440 447" fill="none" stroke="#efd08e" stroke-opacity=".4"/>
<g font-family="'Segoe UI',Tahoma,sans-serif">
<text x="76" y="184" font-size="100" font-weight="800" letter-spacing="-4" fill="#fff7e4">Jangmao<tspan fill="#ffcf70">70</tspan></text>
<rect x="80" y="214" width="68" height="4" rx="2" fill="url(#gold)"/>
<text x="80" y="258" font-size="23" font-weight="700" letter-spacing="2" fill="#c1edff">OFFLINE WORD DOCUMENT AUTOMATION</text>
