<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="jangmao70-user-workflow-title jangmao70-user-workflow-desc">
  <title id="jangmao70-user-workflow-title">Workflow การใช้งาน Jangmao70</title>
  <desc id="jangmao70-user-workflow-desc">ผู้ใช้เปิดโปรแกรม เลือกแท็บจัดซื้อจัดจ้างหรือเบิกเงินเดือน กรอกหรือโหลดข้อมูล ตรวจสอบ สร้างเอกสาร Word และได้ผลลัพธ์แยกตามแท็บ</desc>
  <defs>
    <marker id="user-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="user-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f5f5f5"/>

  <!-- Connectors first -->
  <line x1="600" y1="88" x2="600" y2="112" stroke="#4f5d75" stroke-width="1" marker-end="url(#user-arrow)"/>
  <path d="M528 160 H280 Q272 160 272 168 V252" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#user-arrow-accent)"/>
  <rect x="332" y="132" width="136" height="20" rx="2" fill="#f5f5f5"/>
  <text x="400" y="146" text-anchor="middle" fill="#eb6c36" font-size="12" font-weight="500" font-family="'Geist','Noto Sans Thai',sans-serif">จัดซื้อจัดจ้าง</text>
  <path d="M672 160 H920 Q928 160 928 168 V252" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#user-arrow)"/>
  <rect x="732" y="132" width="136" height="20" rx="2" fill="#f5f5f5"/>
  <text x="800" y="146" text-anchor="middle" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans Thai',sans-serif">เบิกเงินเดือน</text>
  <line x1="272" y1="348" x2="272" y2="420" stroke="#4f5d75" stroke-width="1" marker-end="url(#user-arrow)"/>
  <line x1="928" y1="348" x2="928" y2="420" stroke="#4f5d75" stroke-width="1" marker-end="url(#user-arrow)"/>
  <line x1="272" y1="516" x2="272" y2="568" stroke="#4f5d75" stroke-width="1" marker-end="url(#user-arrow)"/>
  <line x1="928" y1="516" x2="928" y2="568" stroke="#4f5d75" stroke-width="1" marker-end="url(#user-arrow)"/>

  <!-- Start -->
  <rect x="510" y="32" width="180" height="56" rx="28" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <text x="600" y="56" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif">เริ่มงาน</text>
  <text x="600" y="76" text-anchor="middle" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">เปิด Jangmao70</text>

  <!-- Decision -->
  <polygon points="600,112 672,160 600,208 528,160" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="600" y="156" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif">เลือกแท็บ</text>
  <text x="600" y="176" text-anchor="middle" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">เลือกงานที่จะทำ</text>

  <!-- Workflows -->
  <rect x="100" y="252" width="344" height="96" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <rect x="116" y="268" width="76" height="20" rx="2" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
  <text x="154" y="282" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace">PROC</text>
  <text x="272" y="294" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif">กรอก / โหลดข้อมูล</text>
  <text x="272" y="318" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">โรงเรียน · TOR · ลูกจ้าง</text>
  <text x="272" y="338" text-anchor="middle" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">เตรียมและตรวจข้อมูล</text>

  <rect x="756" y="252" width="344" height="96" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <rect x="772" y="268" width="76" height="20" rx="2" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
  <text x="810" y="282" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace">PAY</text>
  <text x="928" y="294" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif">กรอก / โหลดข้อมูล</text>
  <text x="928" y="318" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">งวด · ผู้รับจ้าง · เอกสาร</text>
  <text x="928" y="338" text-anchor="middle" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">เตรียมและตรวจข้อมูล</text>

  <!-- Generated documents -->
  <rect x="100" y="420" width="344" height="96" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <rect x="116" y="436" width="76" height="20" rx="2" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
  <text x="154" y="450" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace">DOCX</text>
  <text x="272" y="462" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif">สร้างเอกสาร Word</text>
  <text x="272" y="486" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">ชุดเอกสารจัดซื้อจัดจ้าง</text>
  <text x="272" y="506" text-anchor="middle" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">เลือกสร้างตามรายการเอกสาร</text>

  <rect x="756" y="420" width="344" height="96" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
  <rect x="772" y="436" width="76" height="20" rx="2" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
  <text x="810" y="450" text-anchor="middle" fill="#4f5d75" font-size="8" font-family="'Geist Mono',ui-monospace,monospace">DOCX</text>
  <text x="928" y="462" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif">สร้างเอกสาร Word</text>
  <text x="928" y="486" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">ชุดเอกสารเบิกเงินเดือน</text>
  <text x="928" y="506" text-anchor="middle" fill="#7a8399" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">คำนวณงวดและเลือกเอกสาร</text>

  <!-- End states -->
  <rect x="148" y="568" width="248" height="56" rx="28" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="272" y="592" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif">เอกสารพร้อมใช้</text>
  <text x="272" y="612" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">Output / เอกสารจัดจ้าง</text>
  <rect x="804" y="568" width="248" height="56" rx="28" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
  <text x="928" y="592" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist','Noto Sans Thai',sans-serif">เอกสารพร้อมใช้</text>
  <text x="928" y="612" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans Thai',sans-serif">Output / เงินเดือน</text>

  <line x1="100" y1="652" x2="1100" y2="652" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
  <text x="100" y="676" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist','Noto Sans Thai',sans-serif">ภาพรวม: ใช้โปรแกรมเดียว แต่แยกงานและผลลัพธ์ตามแท็บ</text>
</svg>
